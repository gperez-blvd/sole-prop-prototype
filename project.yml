name: SoleProp
options:
  bundleIdPrefix: co.blvd.soleprop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"

targets:
  SoleProp:
    type: application
    platform: iOS
    sources:
      - path: SoleProp
    info:
      path: SoleProp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Sole Prop uses your microphone so you can talk to your voice assistant."
        NSSpeechRecognitionUsageDescription: "Sole Prop uses on-device speech recognition to turn what you say to your voice assistant into text."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.blvd.soleprop.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true

schemes:
  SoleProp:
    # The real key lives in Secrets.xcconfig (gitignored, not this file —
    # see Secrets.xcconfig.example for setup). It's loaded as a build
    # setting via `configFiles` above, and this just forwards that build
    # setting into the process environment at launch, so it survives every
    # `xcodegen generate` instead of resetting to empty.
    build:
      targets:
        SoleProp: all
    run:
      config: Debug
      environmentVariables:
        ELEVENLABS_API_KEY: "$(ELEVENLABS_API_KEY)"
