name: SoleProp
options:
  bundleIdPrefix: co.blvd.soleprop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"

targets:
  SoleProp:
    type: application
    platform: iOS
    sources:
      - path: SoleProp
    info:
      path: SoleProp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Sole Prop uses your microphone so you can talk to your voice assistant."
        NSSpeechRecognitionUsageDescription: "Sole Prop uses on-device speech recognition to turn what you say to your voice assistant into text."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.blvd.soleprop.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true

schemes:
  SoleProp:
    # The whole generated .xcodeproj (this scheme included) is gitignored
    # (*.xcodeproj), so nothing here is ever committed regardless of this
    # empty placeholder. Fill in ELEVENLABS_API_KEY yourself via Xcode:
    # Product > Scheme > Edit Scheme > Run > Arguments > Environment
    # Variables — never paste a real key into this file, and note that
    # re-running `xcodegen generate` resets the value back to empty, so
    # you'll need to re-enter it after any regen.
    build:
      targets:
        SoleProp: all
    run:
      config: Debug
      environmentVariables:
        ELEVENLABS_API_KEY: ""
